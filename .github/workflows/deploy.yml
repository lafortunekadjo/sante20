name: Deploy Angular sante20

on:
  push:
    branches: [ main ]

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Set up Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build Angular app
        run: npm run build --configuration=production

      - name: Copy Files to VPS
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.VPS_IP }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          # On cible tout ce qui est dans le dossier de build final
          # Note: Vérifie si ton build crée "dist/sante20" ou "dist/sante20/browser"
          source: "dist/sante20/browser/*"
          target: "/var/www/sante20"
          strip_components: 3 # On retire dist/sante20/browser pour ne copier que le contenu
