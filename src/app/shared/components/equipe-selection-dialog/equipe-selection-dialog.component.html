<h2 mat-dialog-title>Sélectionner une équipe</h2>

<div mat-dialog-content>
  <p *ngIf="data.joueur">
    Joueur : <strong>{{ data.joueur.prenom }} {{ data.joueur.nom }}</strong>
  </p>

  <mat-form-field appearance="fill" class="full-width">
    <mat-label>Équipe</mat-label>
    <mat-select [(value)]="selectedEquipeId">
      <mat-option *ngFor="let equipe of data.equipes" [value]="equipe.id">
        {{ equipe.nom }}
      </mat-option>
    </mat-select>
  </mat-form-field>
</div>

<div mat-dialog-actions align="end">
  <button mat-button (click)="cancel()">Annuler</button>
  <button mat-flat-button color="primary" [disabled]="!selectedEquipeId" (click)="confirmSelection()">Valider</button>
</div>
