<h1 mat-dialog-title class="dialog-title">Modifier la photo de profil</h1>

<div mat-dialog-content class="dialog-content">
  <div class="image-preview-container">
    <img [src]="imagePreviewUrl || '../assets/default-profile.jpg'" alt="Aperçu de la photo de profil" class="image-preview">
  </div>

  <div class="file-input-container">
    <input type="file" #fileInput hidden (change)="onFileSelected($event)" accept="image/*">
    <button mat-raised-button color="primary" class="choose-button" (click)="fileInput.click()">
      <mat-icon>folder_open</mat-icon>
      <span>Choisir une photo</span>
    </button>
  </div>
</div>

<div mat-dialog-actions class="dialog-actions">
  <button mat-button class="cancel-button" (click)="onCancel()">Annuler</button>
  <button mat-raised-button color="accent" class="save-button" [disabled]="!selectedFile" (click)="onSave()">Enregistrer</button>
</div>
