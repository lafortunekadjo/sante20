<div class="auth-container">
  <mat-card class="auth-card">
    <mat-card-header>
      <mat-card-title>Mot de passe oublié</mat-card-title>
      <mat-card-subtitle>Saisissez votre email pour recevoir un lien de réinitialisation.</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="forgotForm" (ngSubmit)="onSubmit()" *ngIf="!emailSent">
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Adresse Email</mat-label>
          <mat-icon matPrefix>email</mat-icon>
          <input matInput type="email" formControlName="email" placeholder="exemple@mail.com" required>
          <mat-error *ngIf="forgotForm.get('email')?.hasError('email')">Email invalide</mat-error>
          <mat-error *ngIf="forgotForm.get('email')?.hasError('required')">L'email est obligatoire</mat-error>
        </mat-form-field>

        <button mat-flat-button color="primary" class="full-width action-btn" [disabled]="forgotForm.invalid || isLoading">
          <mat-spinner diameter="20" *ngIf="isLoading"></mat-spinner>
          <span *ngIf="!isLoading">Envoyer le lien</span>
        </button>
      </form>

      <div class="success-message" *ngIf="emailSent">
        <mat-icon class="success-icon">check_circle</mat-icon>
        <p>Si cet email correspond à un compte, un lien de réinitialisation valable 15 minutes vient d'être généré.</p>
        
      </div>
    </mat-card-content>

    <mat-card-actions>
      <a mat-button routerLink="/login" color="accent">
        <mat-icon>arrow_back</mat-icon> Retour à la connexion
      </a>
    </mat-card-actions>
  </mat-card>
</div>
