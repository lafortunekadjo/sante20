<div class="auth-container">
  <mat-card class="auth-card">
    <mat-card-header>
      <mat-card-title>Nouveau mot de passe</mat-card-title>
      <mat-card-subtitle>Définissez votre nouveau mot de passe sécurisé.</mat-card-subtitle>
    </mat-card-header>

    <mat-card-content>
      <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" *ngIf="!resetSuccess">
        
        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Nouveau mot de passe</mat-label>
          <mat-icon matPrefix>lock</mat-icon>
          <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="password" required>
          <button mat-icon-button matSuffix type="button" (click)="hidePassword = !hidePassword">
            <mat-icon>{{hidePassword ? 'visibility_off' : 'visibility'}}</mat-icon>
          </button>
          <mat-error *ngIf="resetForm.get('password')?.hasError('minlength')">Minimum 6 caractères</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline" class="full-width">
          <mat-label>Confirmer le mot de passe</mat-label>
          <mat-icon matPrefix>lock_reset</mat-icon>
          <input matInput [type]="hidePassword ? 'password' : 'text'" formControlName="confirmPassword" required>
          <mat-error *ngIf="resetForm.hasError('mismatch')">Les mots de passe ne correspondent pas</mat-error>
        </mat-form-field>

        <button mat-flat-button color="primary" class="full-width action-btn" [disabled]="resetForm.invalid || isLoading">
          <mat-spinner diameter="20" *ngIf="isLoading"></mat-spinner>
          <span *ngIf="!isLoading">Mettre à jour</span>
        </button>
      </form>

      <div class="success-message" *ngIf="resetSuccess">
        <mat-icon class="success-icon">check_circle</mat-icon>
        <p>Votre mot de passe a été modifié avec succès !</p>
        <button mat-raised-button color="primary" routerLink="/login" class="full-width">Se connecter</button>
      </div>
    </mat-card-content>
  </mat-card>
</div>
