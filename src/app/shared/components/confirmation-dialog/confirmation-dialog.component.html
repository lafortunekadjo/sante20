<div class="cd-container">
  <div class="cd-icon" [class]="data.type || 'warning'">
    <mat-icon>{{ getIcon() }}</mat-icon>
  </div>

  <h2 mat-dialog-title class="cd-title">
    {{ data.title || ('confirmation.title' | translate) }}
  </h2>

  <mat-dialog-content class="cd-content">
    <p class="cd-message">{{ data.message }}</p>
  </mat-dialog-content>

  <mat-dialog-actions class="cd-actions">
    <button mat-stroked-button (click)="onCancel()" class="cd-cancel-btn">
      {{ data.cancelText || ('common.cancel' | translate) }}
    </button>
    <button mat-raised-button [color]="data.type === 'danger' ? 'warn' : 'primary'"
            (click)="onConfirm()" class="cd-confirm-btn">
      {{ data.confirmText || ('common.confirm' | translate) }}
    </button>
  </mat-dialog-actions>
</div>
