<aside class="sidebar-wrap" *ngIf="publicite && !hidden" [class.is-sticky]="sticky">

  <a class="sidebar-ad"
     (click)="onClick($event)"
     [attr.href]="publicite.lienCible"
     target="_blank"
     rel="noopener noreferrer sponsored">

    <span class="ad-badge">Pub</span>

    <div class="sidebar-img-wrap">
      <img class="sidebar-img"
           [src]="publicite.imageUrl"
           [alt]="publicite.titre"
           (load)="onImageLoad()"
           (error)="onImageError()">
    </div>

    <div class="sidebar-info">
      <div class="company-row">
        <img *ngIf="publicite.entrepriseLogoUrl"
             class="company-logo"
             [src]="publicite.entrepriseLogoUrl"
             [alt]="publicite.entrepriseNom">
        <span class="company-name">{{ publicite.entrepriseNom }}</span>
      </div>
      <p class="sidebar-title">{{ publicite.titre }}</p>
    </div>

    <div class="sidebar-cta">
      <span>Voir plus</span>
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2">
        <path d="M5 12h14M12 5l7 7-7 7"/>
      </svg>
    </div>
  </a>
</aside>
