<div class="feed-wrap" *ngIf="publicite && !hidden" [class.compact]="compact">

  <a class="feed-card"
     (click)="onClick($event)"
     [attr.href]="publicite.lienCible"
     target="_blank"
     rel="noopener noreferrer sponsored">

    <!-- Image -->
    <div class="feed-img-wrap">
      <img class="feed-img"
           [src]="publicite.imageUrl"
           [alt]="publicite.titre"
           (load)="onImageLoad()"
           (error)="onImageError()">
      <span class="sponsored-tag">Sponsorisé</span>
    </div>

    <!-- Contenu -->
    <div class="feed-body">
      <div class="feed-company">
        <div class="company-logo" *ngIf="publicite.entrepriseLogoUrl">
          <img [src]="publicite.entrepriseLogoUrl" [alt]="publicite.entrepriseNom">
        </div>
        <div class="company-logo placeholder" *ngIf="!publicite.entrepriseLogoUrl">
          {{ publicite.entrepriseNom?.charAt(0)?.toUpperCase() }}
        </div>
        <div class="company-meta">
          <span class="company-name">{{ publicite.entrepriseNom }}</span>
          <span class="ad-label">Publicité</span>
        </div>
      </div>

      <h4 class="feed-title">{{ publicite.titre }}</h4>

      <div class="feed-cta">
        <span>Découvrir</span>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
             stroke="currentColor" stroke-width="2">
          <path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>
          <polyline points="15 3 21 3 21 9"/>
          <line x1="10" y1="14" x2="21" y2="3"/>
        </svg>
      </div>
    </div>
  </a>
</div>
