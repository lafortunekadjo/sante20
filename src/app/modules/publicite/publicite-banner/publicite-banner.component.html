<div class="banner-wrap" *ngIf="publicite && !hidden"
     [class.pos-header]="position === 'HEADER'"
     [class.pos-footer]="position === 'FOOTER'"
     [class.pos-explorer]="position === 'EXPLORER_TOP'">

  <a class="banner-ad"
     (click)="onClick($event)"
     [attr.href]="publicite.lienCible"
     target="_blank"
     rel="noopener noreferrer sponsored">

    <img class="banner-img"
         [src]="publicite.imageUrl"
         [alt]="publicite.titre"
         (load)="onImageLoad()"
         (error)="onImageError()">

    <div class="banner-overlay">
      <span class="sponsor-text">{{ publicite.entrepriseNom }} · Sponsorisé</span>
    </div>

    <span class="ad-badge">Ad</span>
  </a>

  <button class="close-btn" *ngIf="closable"
          (click)="onClose($event)" aria-label="Fermer">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none"
         stroke="currentColor" stroke-width="2.5">
      <path d="M18 6L6 18M6 6l12 12"/>
    </svg>
  </button>
</div>
