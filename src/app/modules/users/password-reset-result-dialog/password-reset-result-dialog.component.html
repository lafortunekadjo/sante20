<div class="prd-container">

  <!-- ── Header ──────────────────────────────────────────── -->
  <div class="prd-header">
    <div class="prd-icon success"><mat-icon>check_circle</mat-icon></div>
    <div>
      <h2 mat-dialog-title class="prd-title">Mot de passe réinitialisé</h2>
      <p class="prd-subtitle">Généré avec succès pour {{ data.username }}</p>
    </div>
  </div>

  <mat-dialog-content class="prd-content">

    <!-- Mot de passe -->
    <div class="prd-password-box">
      <label class="prd-label">Nouveau mot de passe</label>
      <div class="prd-password-field">
        <input [type]="hidePassword ? 'password' : 'text'"
               [value]="data.newPassword"
               readonly #passwordInput
               class="prd-password-input">
        <button mat-icon-button (click)="hidePassword = !hidePassword"
                matTooltip="Afficher/Masquer">
          <mat-icon>{{ hidePassword ? 'visibility' : 'visibility_off' }}</mat-icon>
        </button>
        <button mat-icon-button (click)="copyPassword(passwordInput)"
                matTooltip="Copier">
          <mat-icon>content_copy</mat-icon>
        </button>
      </div>
    </div>

    <!-- Avertissement -->
    <div class="prd-warning">
      <mat-icon>warning</mat-icon>
      <div>
        <strong>Important</strong>
        <p>Transmettez ce mot de passe à l'utilisateur de manière sécurisée. Il devra le changer lors de sa prochaine connexion.</p>
      </div>
    </div>

    <!-- Partage -->
    <div class="prd-share">
      <p class="prd-share-label">Partager via :</p>
      <div class="prd-share-buttons">
        <button mat-stroked-button (click)="shareViaWhatsApp()" class="btn-whatsapp">
          <mat-icon>chat</mat-icon><span>WhatsApp</span>
        </button>
        <button mat-stroked-button (click)="shareViaEmail()" class="btn-email">
          <mat-icon>email</mat-icon><span>Email</span>
        </button>
        <button mat-stroked-button (click)="shareViaSMS()" class="btn-sms">
          <mat-icon>sms</mat-icon><span>SMS</span>
        </button>
      </div>
    </div>

  </mat-dialog-content>

  <mat-dialog-actions class="prd-actions">
    <button mat-flat-button color="primary" (click)="close()">
      <mat-icon>done</mat-icon>Terminé
    </button>
  </mat-dialog-actions>

</div>
