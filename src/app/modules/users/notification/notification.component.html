<!-- notifications.component.html -->
<div class="notifications-page">
  <h1>{{ 'notifications.title' | translate }}</h1>

  <div class="notification-list">
    <mat-card *ngFor="let n of notifications" [class.read]="n.lue">
      <mat-card-header>
        <mat-icon [color]="n.type === 'ANNONCE' ? 'primary' : 'accent'">{{ getIcon(n.type) }}</mat-icon>
        <mat-card-title>{{ n.titre }}</mat-card-title>
        <mat-card-subtitle>{{ n.dateEnvoi | date:'short' }}</mat-card-subtitle>
      </mat-card-header>
      <mat-card-content>
        <p>{{ n.message }}</p>
        <button mat-button (click)="goToReference(n)">Voir →</button>
      </mat-card-content>
    </mat-card>
  </div>
</div>
