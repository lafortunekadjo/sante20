<!-- src/app/modules/chat/components/chat-main/chat-main.component.html -->

<div class="chat-container">
  <div class="chat-sidebar">
    <div class="sidebar-header">
      <h2>{{ 'chat.messages' | translate }}</h2>
      <button mat-icon-button [matMenuTriggerFor]="menu">
        <mat-icon>more_vert</mat-icon>
      </button>
      <mat-menu #menu="matMenu">
        <button mat-menu-item (click)="openPrivateChatDialog()">
          <mat-icon>person_add</mat-icon>
          <span>{{ 'chat.newPrivateChat' | translate }}</span>
        </button>
        <button mat-menu-item (click)="openGroupChatDialog()">
          <mat-icon>group_add</mat-icon>
          <span>{{ 'chat.newGroupChat' | translate }}</span>
        </button>
      </mat-menu>
    </div>
    
    <app-conversation-list
      [conversations]="conversations"
      [selectedConversation]="selectedConversation"
      [loading]="loading"
      (conversationSelected)="selectConversation($event)">
    </app-conversation-list>
  </div>

  <div class="chat-main">
    <app-conversation-detail
      *ngIf="selectedConversation"
      [conversation]="selectedConversation">
    </app-conversation-detail>
    
    <div *ngIf="!selectedConversation" class="no-conversation-selected">
      <mat-icon>forum</mat-icon>
      <h3>{{ 'chat.selectConversation' | translate }}</h3>
      <p>{{ 'chat.selectConversationHint' | translate }}</p>
    </div>
  </div>
</div>
