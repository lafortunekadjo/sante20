<div class="affiche-builder-container">
  <!-- Panneau de configuration / Formulaire -->
  <div class="form-panel">
    <h3>Configuration de l'Affiche</h3>

    <div class="form-group">
      <label>Photo du joueur / Action :</label>
      <input type="file" (change)="onFileSelected($event)" accept="image/*" />
    </div>

    <div class="form-group">
      <label>Style de l'Affiche :</label>
      <select [(ngModel)]="selectedStyle">
        <option value="AUTO">Automatique (IA)</option>
        <option value="NEON">Thème Néon / Électrique</option>
        <option value="GRUNGE">Thème Sport / Dynamic</option>
        <option value="MINIMALIST">Thème Minimaliste</option>
      </select>
    </div>

    <div class="actions">
      <button class="btn-primary" (click)="generateAffiche()">Générer l'Affiche</button>
      <button class="btn-success" (click)="downloadAffiche()" [disabled]="!isGenerated">Télécharger PNG</button>
    </div>
  </div>

  <!-- Zone de Rendu Visuel -->
  <div class="preview-panel">
    <canvas #afficheCanvas width="1080" height="1350"></canvas>
  </div>
</div>
