<div class="affiche-builder-container">
  <!-- Panneau de configuration / Formulaire -->
  <div class="form-panel">
    <h3>Configuration de l'Affiche</h3>

    <div class="form-group">
      <label>{{ 'ui.photo_du_joueur_action_5d1e' | translate }}</label>
      <input type="file" (change)="onFileSelected($event)" accept="image/*" />
    </div>

    <div class="form-group">
      <label>Style de l'Affiche :</label>
      <select [(ngModel)]="selectedStyle">
        <option value="AUTO">Automatique (IA)</option>
        <option value="NEON">{{ 'ui.theme_neon_electrique_1cb7' | translate }}</option>
        <option value="GRUNGE">{{ 'ui.theme_sport_dynamic_5836' | translate }}</option>
        <option value="MINIMALIST">{{ 'ui.theme_minimaliste_9e30' | translate }}</option>
      </select>
    </div>

    <div class="actions">
      <button class="btn-primary" (click)="generateAffiche()">{{ 'ui.generer_l_affiche_97aa' | translate }}</button>
      <button class="btn-success" (click)="downloadAffiche()" [disabled]="!isGenerated">{{ 'ui.telecharger_png_ed51' | translate }}</button>
    </div>
  </div>

  <!-- Zone de Rendu Visuel -->
  <div class="preview-panel">
    <canvas #afficheCanvas width="1080" height="1350"></canvas>
  </div>
</div>
