<!-- src/app/modules/chat/components/match-request-chat-button/match-request-chat-button.component.html -->

<button 
  mat-raised-button 
  color="primary"
  (click)="openChat()"
  [disabled]="loading">
  <mat-icon *ngIf="!loading">chat</mat-icon>
  <mat-spinner *ngIf="loading" diameter="20"></mat-spinner>
  <span>{{ existingConversationId ? 'Voir la discussion' : 'Démarrer une discussion' }}</span>
</button>
