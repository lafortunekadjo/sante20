
    <div class="login-prompt-dialog">
      <h2 mat-dialog-title class="dialog-header">
        <mat-icon class="header-icon">lock</mat-icon>
        <h2 class="dialog-title">Connexion requise</h2>
        <p class="dialog-subtitle">Pour rejoindre {{ data.groupe.nom }}</p>
      </h2>

      <mat-dialog-content class="dialog-content">
        <div class="message-box">
          <mat-icon class="message-icon">info</mat-icon>
          <p class="message-text">
            Vous devez être connecté pour soumettre une demande d'adhésion à ce groupe.
          </p>
        </div>

        <div class="groupe-info">
          <div class="info-item">
            <mat-icon>sports</mat-icon>
            <span>{{ data.groupe.discipline }}</span>
          </div>
          <div class="info-item">
            <mat-icon>place</mat-icon>
            <span>{{ data.groupe.ville }}</span>
          </div>
          <div class="info-item">
            <mat-icon>payments</mat-icon>
            <span>{{ data.groupe.fraisAdhesion }} FCFA</span>
          </div>
        </div>

        <mat-divider></mat-divider>

        <div class="actions-container">
          <h3 class="actions-title">Que souhaitez-vous faire ?</h3>

          <button 
            mat-raised-button 
            color="primary"
            (click)="login()"
            class="action-btn">
            <mat-icon>login</mat-icon>
            <div class="btn-content">
              <span class="btn-title">Se connecter</span>
              <span class="btn-subtitle">J'ai déjà un compte</span>
            </div>
          </button>

          <button 
            mat-raised-button 
            color="accent"
            (click)="signup()"
            class="action-btn">
            <mat-icon>person_add</mat-icon>
            <div class="btn-content">
              <span class="btn-title">Créer un compte</span>
              <span class="btn-subtitle">Je suis nouveau</span>
            </div>
          </button>

          <button 
            mat-stroked-button
            (click)="cancel()"
            class="cancel-btn">
            <mat-icon>close</mat-icon>
            Annuler
          </button>
        </div>
      </mat-dialog-content>
    </div>
