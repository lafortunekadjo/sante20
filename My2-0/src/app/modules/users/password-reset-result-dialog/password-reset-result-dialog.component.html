<!-- password-reset-result-dialog.component.html -->
<div class="password-dialog">
  <div class="dialog-header">
    <div class="header-icon success">
      <mat-icon>check_circle</mat-icon>
    </div>
    <h2>Mot de passe réinitialisé</h2>
    <p>Le nouveau mot de passe a été généré avec succès</p>
  </div>

  <div class="dialog-body">
    <div class="user-info">
      <mat-icon>person</mat-icon>
      <span>{{ data.username }}</span>
    </div>

    <div class="password-box">
      <label>Nouveau mot de passe</label>
      <div class="password-field">
        <input 
          [type]="hidePassword ? 'password' : 'text'" 
          [value]="data.newPassword" 
          readonly 
          #passwordInput>
        <button mat-icon-button (click)="hidePassword = !hidePassword" matTooltip="Afficher/Masquer">
          <mat-icon>{{ hidePassword ? 'visibility' : 'visibility_off' }}</mat-icon>
        </button>
        <button mat-icon-button (click)="copyPassword(passwordInput)" matTooltip="Copier">
          <mat-icon>content_copy</mat-icon>
        </button>
      </div>
    </div>

    <div class="warning-box">
      <mat-icon>warning</mat-icon>
      <div class="warning-content">
        <strong>Important</strong>
        <p>Transmettez ce mot de passe à l'utilisateur de manière sécurisée. Il devra le changer lors de sa prochaine connexion.</p>
      </div>
    </div>

    <div class="share-options">
      <p class="share-label">Partager via :</p>
      <div class="share-buttons">
        <button mat-stroked-button (click)="shareViaWhatsApp()" class="btn-whatsapp">
          <mat-icon>chat</mat-icon>
          WhatsApp
        </button>
        <button mat-stroked-button (click)="shareViaEmail()" class="btn-email">
          <mat-icon>email</mat-icon>
          Email
        </button>
        <button mat-stroked-button (click)="shareViaSMS()" class="btn-sms">
          <mat-icon>sms</mat-icon>
          SMS
        </button>
      </div>
    </div>
  </div>

  <div class="dialog-footer">
    <button mat-flat-button color="primary" (click)="close()">
      <mat-icon>done</mat-icon>
      Terminé
    </button>
  </div>
</div>
